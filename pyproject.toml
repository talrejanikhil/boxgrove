[project]
name = "boxgrove"
version = "0.1.0"
description = "Multi-category e-commerce chat agent, running example for Prompting LangSmith for LLMOps"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.162.0",
    "jinja2==3.1.6",
    "langchain-core==1.7.0",
    "openai==3.37.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "qdrant-client==1.20.0",
    "sqlalchemy==2.1.6",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.2",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
